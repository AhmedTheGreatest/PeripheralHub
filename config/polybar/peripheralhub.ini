; ==========================================================
; PeripheralHub Module for Polybar
; Unified Battery Monitor for Attack Shark X11, AULA F75,
; and Razer Barracuda X (2022)
; ==========================================================
;
; Installation:
; 1. Copy or include this file in ~/.config/polybar/config.ini:
;      include-file = ~/.config/polybar/peripheralhub.ini
;
; 2. Add "peripheralhub" to your active modules (e.g. modules-right):
;      modules-right = peripheralhub pulseaudio wlan date
;
; Features:
; - Real-time battery percentages from 2.4 GHz receivers
; - Nerd Font device icons (󰍽 Mouse, 󰌌 Keyboard, 󰋋 Headset)
; - Color-coded battery alerts matching your Catppuccin Mocha theme
; - Click left: Display detailed pop-up notification with all device stats
; - Click right: Force immediate hardware refresh

[module/peripheralhub]
type = custom/script
exec = ~/.local/bin/peripheralhub status
interval = 5
click-left = ~/.local/bin/peripheralhub details
click-right = ~/.local/bin/peripheralhub poll-once
format = <label>
label = %output%
format-foreground = ${colors.foreground}
